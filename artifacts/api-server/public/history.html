<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game History · Tic Tac Toe AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="nav" data-nav></nav>
  <main class="container">
    <div class="row between" style="margin-bottom:18px;">
      <h1 style="margin:0; font-size:28px;">Game History</h1>
      <a href="/game" class="btn primary">Play again</a>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="row" style="gap:12px; flex-wrap:wrap;">
        <div class="field" style="margin:0; flex:1; min-width:120px;">
          <label for="filterResult">Result</label>
          <select id="filterResult" class="input">
            <option value="">All results</option>
            <option value="win">Wins</option>
            <option value="loss">Losses</option>
            <option value="draw">Draws</option>
          </select>
        </div>
        <div class="field" style="margin:0; flex:1; min-width:120px;">
          <label for="filterMode">Mode</label>
          <select id="filterMode" class="input">
            <option value="">All modes</option>
            <option value="pvai">vs AI</option>
            <option value="pvp">vs Friend</option>
          </select>
        </div>
        <div class="field" style="margin:0; flex:1; min-width:120px;">
          <label for="filterDiff">Difficulty</label>
          <select id="filterDiff" class="input">
            <option value="">All difficulties</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>
    </div>

    <div id="historyError"></div>

    <div class="card">
      <div id="summaryBar" style="margin-bottom:14px; display:flex; gap:16px; flex-wrap:wrap;"></div>
      <div id="historyList">Loading…</div>
    </div>

    <!-- Board modal -->
    <div id="boardModal" style="display:none;" class="modal-overlay">
      <div class="modal-box card" style="max-width:360px;">
        <div class="row between" style="margin-bottom:12px;">
          <h2 style="margin:0;">Final board</h2>
          <button id="closeBoardModal" class="ghost" style="font-size:18px; padding:2px 8px;">✕</button>
        </div>
        <div id="modalInfo" class="muted" style="font-size:13px; margin-bottom:10px;"></div>
        <div id="modalBoard" class="board" style="max-width:260px; margin:0 auto;"></div>
        <div id="modalMoves" style="margin-top:14px; font-size:13px;"></div>
      </div>
    </div>

    <!-- Note edit modal -->
    <div id="noteModal" style="display:none;" class="modal-overlay">
      <div class="modal-box card" style="max-width:400px;">
        <div class="row between" style="margin-bottom:12px;">
          <h2 style="margin:0;">Game note</h2>
          <button id="closeNoteModal" class="ghost" style="font-size:18px; padding:2px 8px;">✕</button>
        </div>
        <p class="muted" style="font-size:13px; margin:0 0 10px;">Add a personal note to remember this game. Max 300 characters.</p>
        <div class="field" style="margin-bottom:12px;">
          <textarea id="noteText" class="input" rows="4" maxlength="300" style="resize:vertical;" placeholder="e.g. Almost beat the AI on hard! Blundered move 7…"></textarea>
          <div id="noteCharCount" class="muted" style="font-size:12px; text-align:right; margin-top:4px;">0 / 300</div>
        </div>
        <div id="noteError" style="margin-bottom:8px;"></div>
        <div class="row" style="gap:10px;">
          <button id="saveNoteBtn" class="primary">Save note</button>
          <button id="cancelNoteBtn">Cancel</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, api, escapeHtml, showError, clearError } from '/main.js';

    const user = await renderNav('/history');
    if (!user) { window.location.href = '/login'; }

    let allGames = [];
    let activeNoteGameId = null;

    const MARKS = { X: 'x', O: 'o' };
    const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function getWinCells(board) {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) return line;
      }
      return [];
    }

    function renderMiniBoard(board) {
      const winCells = getWinCells(board);
      return board.map((cell, i) => {
        const cls = ['cell', cell ? MARKS[cell] : '', cell ? 'filled' : '', winCells.includes(i) ? 'win' : ''].filter(Boolean).join(' ');
        return `<div class="${cls}">${cell || ''}</div>`;
      }).join('');
    }

    function diffLabel(d) {
      return d === 'easy' ? 'Easy' : d === 'medium' ? 'Medium' : d === 'hard' ? 'Hard' : d || '';
    }

    function personalityLabel(p) {
      return p === 'trash_talker' ? 'Trash Talker' : p === 'cheerleader' ? 'Cheerleader' : p === 'zen_master' ? 'Zen Master' : p || '';
    }

    function openNoteModal(game) {
      activeNoteGameId = game.id;
      document.getElementById('noteText').value = game.note || '';
      updateCharCount();
      clearError(document.getElementById('noteError'));
      document.getElementById('noteModal').style.display = '';
      document.getElementById('noteText').focus();
    }

    function updateCharCount() {
      const len = document.getElementById('noteText').value.length;
      document.getElementById('noteCharCount').textContent = `${len} / 300`;
    }

    function renderList(games) {
      const list = document.getElementById('historyList');
      if (!games.length) {
        list.innerHTML = '<p class="muted">No games match your filters.</p>';
        return;
      }
      list.innerHTML = `
        <table>
          <thead><tr>
            <th>Date</th>
            <th>Result</th>
            <th>Mode</th>
            <th>Difficulty</th>
            <th>Personality</th>
            <th>Moves</th>
            <th>Note</th>
            <th></th>
          </tr></thead>
          <tbody>
            ${games.map(g => `
              <tr data-id="${escapeHtml(g.id)}">
                <td style="white-space:nowrap;">${new Date(g.playedAt).toLocaleDateString()}</td>
                <td><span class="badge ${g.result}">${g.result}</span></td>
                <td>${g.mode === 'pvai' ? 'vs AI' : 'vs Friend'}</td>
                <td>${escapeHtml(diffLabel(g.difficulty))}</td>
                <td>${escapeHtml(personalityLabel(g.personality))}</td>
                <td class="right">${g.moves ? g.moves.length : '—'}</td>
                <td style="max-width:160px;">
                  ${g.note
                    ? `<span class="note-preview" style="font-size:12px; color:var(--text);" title="${escapeHtml(g.note)}">${escapeHtml(g.note.length > 40 ? g.note.slice(0, 40) + '…' : g.note)}</span>`
                    : '<span class="muted" style="font-size:12px;">—</span>'}
                </td>
                <td style="white-space:nowrap;">
                  <button class="viewBoardBtn ghost" style="color:var(--accent); font-size:13px;" data-id="${escapeHtml(g.id)}">Board</button>
                  <button class="editNoteBtn ghost" style="color:var(--accent); font-size:13px; margin-left:4px;" data-id="${escapeHtml(g.id)}">${g.note ? 'Edit note' : 'Add note'}</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      list.querySelectorAll('.viewBoardBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          const game = games.find(g => g.id === btn.dataset.id);
          if (!game) return;
          document.getElementById('modalInfo').innerHTML =
            `${new Date(game.playedAt).toLocaleString()} &bull; <span class="badge ${game.result}">${game.result}</span>` +
            (game.mode === 'pvai' ? ` &bull; ${diffLabel(game.difficulty)} difficulty` : ' &bull; vs Friend');
          document.getElementById('modalBoard').innerHTML = renderMiniBoard(game.board || []);
          document.getElementById('modalMoves').innerHTML = game.moves && game.moves.length
            ? `<strong>Move order:</strong> ${game.moves.map((m, i) => `<span class="badge ${m.mark === 'X' ? 'win' : 'loss'}" style="margin:2px;">#${i+1} ${m.mark}→${m.index}</span>`).join(' ')}`
            : '';
          document.getElementById('boardModal').style.display = '';
        });
      });

      list.querySelectorAll('.editNoteBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          const game = allGames.find(g => g.id === btn.dataset.id);
          if (!game) return;
          openNoteModal(game);
        });
      });
    }

    function applyFilters() {
      const result = document.getElementById('filterResult').value;
      const mode = document.getElementById('filterMode').value;
      const diff = document.getElementById('filterDiff').value;
      const filtered = allGames.filter(g =>
        (!result || g.result === result) &&
        (!mode || g.mode === mode) &&
        (!diff || g.difficulty === diff)
      );

      const wins = filtered.filter(g => g.result === 'win').length;
      const losses = filtered.filter(g => g.result === 'loss').length;
      const draws = filtered.filter(g => g.result === 'draw').length;
      document.getElementById('summaryBar').innerHTML = `
        <span><strong>${filtered.length}</strong> game${filtered.length !== 1 ? 's' : ''}</span>
        <span class="badge win">${wins} W</span>
        <span class="badge loss">${losses} L</span>
        <span class="badge draw">${draws} D</span>
        ${filtered.length > 0 ? `<span class="muted">${Math.round(wins/filtered.length*100)}% win rate</span>` : ''}
      `;
      renderList(filtered);
    }

    ['filterResult', 'filterMode', 'filterDiff'].forEach(id => {
      document.getElementById(id).addEventListener('change', applyFilters);
    });

    document.getElementById('closeBoardModal').addEventListener('click', () => {
      document.getElementById('boardModal').style.display = 'none';
    });
    document.getElementById('boardModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('boardModal')) {
        document.getElementById('boardModal').style.display = 'none';
      }
    });

    document.getElementById('closeNoteModal').addEventListener('click', () => {
      document.getElementById('noteModal').style.display = 'none';
    });
    document.getElementById('cancelNoteBtn').addEventListener('click', () => {
      document.getElementById('noteModal').style.display = 'none';
    });
    document.getElementById('noteModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('noteModal')) {
        document.getElementById('noteModal').style.display = 'none';
      }
    });

    document.getElementById('noteText').addEventListener('input', updateCharCount);

    document.getElementById('saveNoteBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveNoteBtn');
      const errBox = document.getElementById('noteError');
      clearError(errBox);
      btn.disabled = true;

      const note = document.getElementById('noteText').value;
      try {
        const { game: updated } = await api(`/api/games/${activeNoteGameId}/note`, {
          method: 'PUT',
          body: { note },
        });
        const idx = allGames.findIndex(g => g.id === activeNoteGameId);
        if (idx !== -1) allGames[idx].note = updated.note;
        document.getElementById('noteModal').style.display = 'none';
        applyFilters();
      } catch (err) {
        showError(errBox, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    try {
      const { games } = await api('/api/games/mine');
      allGames = games;
      applyFilters();
    } catch (err) {
      showError(document.getElementById('historyError'), err.message);
    }
  </script>
</body>
</html>
