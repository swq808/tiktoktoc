<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard · Tic Tac Toe AI</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    @media (max-width: 600px) { .admin-grid { grid-template-columns: 1fr; } }
    .stat-card { text-align: center; }
    .stat-card .stat-big { display: block; font-size: 42px; font-weight: bold; color: var(--accent); line-height: 1; }
    .stat-card .stat-label { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .section-title { font-size: 20px; font-weight: bold; margin: 0 0 12px; }
    .role-badge {
      display: inline-block; padding: 2px 8px; border-radius: 3px;
      font-size: 12px; font-weight: bold; border: 1px solid;
    }
    .role-badge.admin { background: #fff3cd; color: #856404; border-color: #ffc107; }
    .role-badge.user  { background: #e8eaff; color: #3355cc; border-color: #aabbff; }
    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 3px;
      font-size: 12px; font-weight: bold; border: 1px solid;
    }
    .status-badge.active   { background: #ddffdd; color: #006600; border-color: #88cc88; }
    .status-badge.inactive { background: #eeeeee; color: #555555; border-color: #bbbbbb; }
    .danger { background: #cc0000 !important; border-color: #aa0000 !important; color: white !important; }
    .danger:hover { background: #aa0000 !important; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    #annForm { display: none; margin-bottom: 16px; }
    #annForm.open { display: block; }
    .user-row td { vertical-align: middle; }
  </style>
</head>
<body>
  <nav class="nav" data-nav></nav>
  <main class="container" style="max-width: 1000px;">
    <div class="row between" style="margin-bottom: 18px;">
      <h1 style="margin: 0; font-size: 28px;">Admin Dashboard</h1>
      <span class="role-badge admin">Admin only</span>
    </div>

    <div id="pageError"></div>

    <!-- Quick stats -->
    <div class="admin-grid" id="statsRow">
      <div class="card stat-card"><span class="stat-big" id="statUsers">—</span><div class="stat-label">Total users</div></div>
      <div class="card stat-card"><span class="stat-big" id="statGames">—</span><div class="stat-label">Total games</div></div>
      <div class="card stat-card"><span class="stat-big" id="statToday">—</span><div class="stat-label">Games today</div></div>
    </div>

    <!-- Tab navigation -->
    <div class="tabs" style="margin-bottom: 16px;">
      <button class="active" data-tab="users">Users</button>
      <button data-tab="announcements">Announcements</button>
    </div>

    <!-- Users tab -->
    <div class="tab-content active" id="tab-users">
      <div class="card">
        <div class="row between" style="margin-bottom: 12px;">
          <div class="section-title" style="margin: 0;">All users</div>
          <span class="muted" id="userCount"></span>
        </div>
        <div id="usersTableWrap">Loading…</div>
      </div>
    </div>

    <!-- Announcements tab -->
    <div class="tab-content" id="tab-announcements">
      <div class="card">
        <div class="row between" style="margin-bottom: 12px;">
          <div class="section-title" style="margin: 0;">Announcements</div>
          <button class="primary" id="newAnnBtn">+ New announcement</button>
        </div>

        <!-- Create / Edit form -->
        <div id="annForm" class="card" style="background: #f8f8ff; border-color: #aabbff; margin-bottom: 16px;">
          <h3 style="margin: 0 0 12px;" id="annFormTitle">New announcement</h3>
          <input type="hidden" id="annEditId" />
          <div class="field">
            <label for="annTitle">Title</label>
            <input id="annTitle" class="input" maxlength="100" placeholder="Announcement title…" />
          </div>
          <div class="field">
            <label for="annBody">Body</label>
            <textarea id="annBody" class="input" rows="3" maxlength="500" placeholder="Announcement text…"></textarea>
          </div>
          <div class="field">
            <label for="annStatus">Status</label>
            <select id="annStatus" class="input" style="width: auto;">
              <option value="active">Active (visible to all users)</option>
              <option value="inactive">Inactive (hidden)</option>
            </select>
          </div>
          <div class="field" style="margin-top: 14px;">
            <div class="row" style="gap: 10px;">
              <button class="primary" id="annSaveBtn">Save</button>
              <button id="annCancelBtn">Cancel</button>
            </div>
            <div id="annFormError" style="margin-top: 8px;"></div>
          </div>
        </div>

        <div id="annListWrap">Loading…</div>
      </div>
    </div>
  </main>

  <!-- Role change confirmation modal -->
  <div class="modal-overlay" id="roleModal" style="display:none;">
    <div class="modal-box card">
      <h3 style="margin: 0 0 10px;" id="roleModalTitle">Change role</h3>
      <p id="roleModalBody" style="color: var(--muted); font-size: 14px; margin: 0 0 16px;"></p>
      <div class="row" style="gap: 10px;">
        <button class="primary" id="roleConfirmBtn">Confirm</button>
        <button id="roleCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete announcement confirmation modal -->
  <div class="modal-overlay" id="deleteModal" style="display:none;">
    <div class="modal-box card">
      <h3 style="margin: 0 0 10px;">Delete announcement</h3>
      <p id="deleteModalBody" style="color: var(--muted); font-size: 14px; margin: 0 0 16px;"></p>
      <div class="row" style="gap: 10px;">
        <button class="danger" id="deleteConfirmBtn">Delete</button>
        <button id="deleteCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { renderNav, api, escapeHtml, showError, clearError } from '/main.js';

    const user = await renderNav('/admin');
    if (!user) { window.location.href = '/login'; }
    if (user && user.role !== 'admin') {
      document.querySelector('main').innerHTML =
        '<div class="alert error" style="margin-top:40px; text-align:center;">Access denied. Admin only.</div>';
      throw new Error('Not admin');
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      });
    });

    // ── Load stats ────────────────────────────────────────────────────────────
    async function loadStats() {
      try {
        const d = await api('/api/admin/stats');
        document.getElementById('statUsers').textContent = d.totalUsers;
        document.getElementById('statGames').textContent = d.totalGames;
        document.getElementById('statToday').textContent = d.gamesToday;
      } catch (err) {
        showError(document.getElementById('pageError'), err.message);
      }
    }

    // ── Load users ────────────────────────────────────────────────────────────
    let pendingRole = null;

    async function loadUsers() {
      try {
        const d = await api('/api/admin/users');
        const users = d.users;
        document.getElementById('userCount').textContent = `${users.length} user${users.length !== 1 ? 's' : ''}`;

        if (!users.length) {
          document.getElementById('usersTableWrap').innerHTML = '<p class="muted">No users found.</p>';
          return;
        }

        const rows = users.map(u => {
          const roleBadge = u.role === 'admin'
            ? '<span class="role-badge admin">Admin</span>'
            : '<span class="role-badge user">User</span>';
          const opposite = u.role === 'admin' ? 'user' : 'admin';
          const btnLabel = u.role === 'admin' ? 'Make user' : 'Make admin';
          const isSelf = u.username === user.username;
          const roleBtn = isSelf
            ? '<span class="muted" style="font-size:12px;">(you)</span>'
            : `<button class="role-toggle-btn" style="font-size:12px; padding:4px 8px;"
                data-id="${escapeHtml(u.id)}"
                data-name="${escapeHtml(u.displayName || u.username)}"
                data-role="${escapeHtml(opposite)}"
              >${escapeHtml(btnLabel)}</button>`;

          return `<tr class="user-row">
            <td>
              <div style="font-weight:bold;">${escapeHtml(u.displayName || u.username)}</div>
              <div class="muted" style="font-size:12px;">@${escapeHtml(u.username)}</div>
            </td>
            <td>${roleBadge}</td>
            <td>${escapeHtml(u.country || '—')}</td>
            <td class="right">${u.gameCount}</td>
            <td class="right">${u.wins}</td>
            <td class="right">${new Date(u.createdAt).toLocaleDateString()}</td>
            <td>${roleBtn}</td>
          </tr>`;
        }).join('');

        document.getElementById('usersTableWrap').innerHTML = `
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>User</th>
                  <th>Role</th>
                  <th>Country</th>
                  <th class="right">Games</th>
                  <th class="right">Wins</th>
                  <th class="right">Joined</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;

        document.querySelectorAll('.role-toggle-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            pendingRole = { id: btn.dataset.id, name: btn.dataset.name, role: btn.dataset.role };
            document.getElementById('roleModalTitle').textContent =
              btn.dataset.role === 'admin' ? 'Promote to admin?' : 'Demote to user?';
            document.getElementById('roleModalBody').textContent =
              `Are you sure you want to change ${btn.dataset.name}'s role to "${btn.dataset.role}"?`;
            document.getElementById('roleModal').style.display = 'flex';
          });
        });
      } catch (err) {
        document.getElementById('usersTableWrap').innerHTML =
          `<div class="alert error">${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('roleConfirmBtn').addEventListener('click', async () => {
      if (!pendingRole) return;
      const btn = document.getElementById('roleConfirmBtn');
      btn.disabled = true;
      try {
        await api(`/api/admin/users/${pendingRole.id}/role`, { method: 'PUT', body: { role: pendingRole.role } });
        document.getElementById('roleModal').style.display = 'none';
        pendingRole = null;
        await loadUsers();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('roleCancelBtn').addEventListener('click', () => {
      document.getElementById('roleModal').style.display = 'none';
      pendingRole = null;
    });

    // ── Announcements ─────────────────────────────────────────────────────────
    let pendingDeleteId = null;

    function openAnnForm(ann) {
      const form = document.getElementById('annForm');
      const isEdit = !!ann;
      document.getElementById('annFormTitle').textContent = isEdit ? 'Edit announcement' : 'New announcement';
      document.getElementById('annEditId').value = isEdit ? ann.id : '';
      document.getElementById('annTitle').value = isEdit ? ann.title : '';
      document.getElementById('annBody').value = isEdit ? ann.body : '';
      document.getElementById('annStatus').value = isEdit ? ann.status : 'active';
      clearError(document.getElementById('annFormError'));
      form.classList.add('open');
      document.getElementById('annTitle').focus();
    }

    function closeAnnForm() {
      document.getElementById('annForm').classList.remove('open');
      clearError(document.getElementById('annFormError'));
    }

    async function loadAnnouncements() {
      try {
        const d = await api('/api/admin/announcements');
        const anns = d.announcements;

        if (!anns.length) {
          document.getElementById('annListWrap').innerHTML = '<p class="muted">No announcements yet.</p>';
          return;
        }

        document.getElementById('annListWrap').innerHTML = anns.map(a => `
          <div class="ann-row" data-id="${escapeHtml(a.id)}">
            <div class="ann-info">
              <div style="font-weight:bold; margin-bottom:2px;">
                ${escapeHtml(a.title)}
                <span class="status-badge ${escapeHtml(a.status)}" style="margin-left:6px;">${escapeHtml(a.status)}</span>
              </div>
              <div class="muted" style="font-size:13px; margin-bottom:4px;">${escapeHtml(a.body)}</div>
              <div class="muted" style="font-size:12px;">
                Created ${new Date(a.createdAt).toLocaleDateString()} by ${escapeHtml(a.createdBy)}
                ${a.updatedAt ? ` · Updated ${new Date(a.updatedAt).toLocaleDateString()}` : ''}
              </div>
            </div>
            <div class="ann-actions">
              <button class="ann-edit-btn" data-id="${escapeHtml(a.id)}" style="font-size:12px; padding:4px 10px;">Edit</button>
              <button class="ann-toggle-btn danger" data-id="${escapeHtml(a.id)}"
                data-status="${escapeHtml(a.status === 'active' ? 'inactive' : 'active')}"
                style="font-size:12px; padding:4px 10px; background:${a.status === 'active' ? '#888' : '#3355cc'} !important; border-color:${a.status === 'active' ? '#666' : '#1133aa'} !important;">
                ${a.status === 'active' ? 'Deactivate' : 'Activate'}
              </button>
              <button class="ann-delete-btn danger" data-id="${escapeHtml(a.id)}" data-title="${escapeHtml(a.title)}"
                style="font-size:12px; padding:4px 10px;">Delete</button>
            </div>
          </div>`).join('');

        // Wire announcement buttons — attach to stored announcements list
        const annMap = Object.fromEntries(anns.map(a => [a.id, a]));

        document.querySelectorAll('.ann-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => openAnnForm(annMap[btn.dataset.id]));
        });

        document.querySelectorAll('.ann-toggle-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            try {
              await api(`/api/admin/announcements/${btn.dataset.id}`, {
                method: 'PUT', body: { status: btn.dataset.status }
              });
              await loadAnnouncements();
            } catch (err) { alert(err.message); }
            finally { btn.disabled = false; }
          });
        });

        document.querySelectorAll('.ann-delete-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            pendingDeleteId = btn.dataset.id;
            document.getElementById('deleteModalBody').textContent =
              `Delete "${btn.dataset.title}"? This cannot be undone.`;
            document.getElementById('deleteModal').style.display = 'flex';
          });
        });
      } catch (err) {
        document.getElementById('annListWrap').innerHTML =
          `<div class="alert error">${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('newAnnBtn').addEventListener('click', () => openAnnForm(null));
    document.getElementById('annCancelBtn').addEventListener('click', closeAnnForm);

    document.getElementById('annSaveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('annSaveBtn');
      const errBox = document.getElementById('annFormError');
      clearError(errBox);
      const id = document.getElementById('annEditId').value;
      const title = document.getElementById('annTitle').value.trim();
      const body = document.getElementById('annBody').value.trim();
      const status = document.getElementById('annStatus').value;

      if (!title) { showError(errBox, 'Title is required.'); return; }
      if (!body)  { showError(errBox, 'Body is required.'); return; }

      btn.disabled = true;
      try {
        if (id) {
          await api(`/api/admin/announcements/${id}`, { method: 'PUT', body: { title, body, status } });
        } else {
          await api('/api/admin/announcements', { method: 'POST', body: { title, body, status } });
        }
        closeAnnForm();
        await loadAnnouncements();
      } catch (err) {
        showError(errBox, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('deleteConfirmBtn').addEventListener('click', async () => {
      if (!pendingDeleteId) return;
      const btn = document.getElementById('deleteConfirmBtn');
      btn.disabled = true;
      try {
        await api(`/api/admin/announcements/${pendingDeleteId}`, { method: 'DELETE' });
        document.getElementById('deleteModal').style.display = 'none';
        pendingDeleteId = null;
        await loadAnnouncements();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('deleteCancelBtn').addEventListener('click', () => {
      document.getElementById('deleteModal').style.display = 'none';
      pendingDeleteId = null;
    });

    // Close modals on overlay click
    ['roleModal', 'deleteModal'].forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        if (e.target === e.currentTarget) {
          e.currentTarget.style.display = 'none';
          pendingRole = null;
          pendingDeleteId = null;
        }
      });
    });

    // ── Initial load ──────────────────────────────────────────────────────────
    await Promise.all([loadStats(), loadUsers(), loadAnnouncements()]);
  </script>
</body>
</html>
